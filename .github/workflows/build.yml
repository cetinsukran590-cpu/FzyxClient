name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/gradle-build-action@v2
      - name: Build with Gradle
        run: gradle build
      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: FzyxClient-Jar
          path: build/libs/*.jar
          
